name: Test all inputs are accepted by the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: gollum
          GITHUB_EVENT_PATH: /github/workspace/tests/fixtures/valid-payload.json
          SLACK_TOKEN: fake-slack-token
          SLACK_WEBHOOK: https://hooks.slack.com/services/fake/webhook/url
          SLACK_USERNAME: test-bot
          SLACK_CHANNEL: "#test-channel"
          PAGES_TO_WATCH: ".*"
        with:
          slack_token: fake-slack-token
          slack_webhook: https://hooks.slack.com/services/fake/webhook/url
          slack_username: test-bot
          slack_channel: "#test-channel"
          pages_to_watch: ".*"

      - name: Assert action ran (success or failure is acceptable with fake Slack creds)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
