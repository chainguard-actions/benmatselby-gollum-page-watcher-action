name: Test pages_to_watch filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: gollum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          slack_webhook: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          pages_to_watch: "^Home$"

      - name: Assert action ran with pages filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (either succeeded or failed due to invalid webhook)
          # but it must not have been skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with pages_to_watch filter (outcome=$OUTCOME)"
