name: Test pages_to_watch filter matches no pages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: gollum
          GITHUB_EVENT_PATH: /github/workspace/tests/fixtures/valid-payload.json
          SLACK_WEBHOOK: "https://hooks.slack.com/services/fake/webhook/url"
          PAGES_TO_WATCH: "^ThisPageDoesNotExistInPayload$"

      - name: Assert action did not crash unexpectedly
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action exits 0 when no pages match the filter (success),
          # or exits 1 when the event name is not 'gollum' (failure under act).
          # Either outcome is acceptable — we just verify the step ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
