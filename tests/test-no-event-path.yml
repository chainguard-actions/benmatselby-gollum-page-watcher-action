name: Test missing GITHUB_EVENT_PATH exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: gollum
          GITHUB_EVENT_PATH: /nonexistent/path/to/event.json
          SLACK_WEBHOOK: "https://hooks.slack.com/services/fake/webhook/url"

      - name: Assert action failed due to missing event path
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_EVENT_PATH points to non-existent file, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_EVENT_PATH is not a valid file"
